<!DOCTYPE html> <!-- HTML5の文書宣言 -->
<html lang="ja"> <!-- 言語設定：日本語 -->
<head> <!-- 管理情報エリア -->
  <meta charset="UTF-8"> <!-- 文字化け防止設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- スマホ表示最適化 -->
  <title>スプラ2 武器くじ</title>
  
  <!-- 外部CSSファイルの読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container"> <!-- アプリのメインカード -->
    <h1>スプラ2 ナワバリ武器くじ</h1>
    <div class="result-box" id="result">???</div> <!-- 抽選結果表示エリア -->
    
    <!-- 全体選択数の表示エリア（追加） -->
    <div class="total-count" id="totalCount">選択中: 0 / 0</div>

    <button onclick="drawWeapon()" style="margin-bottom: 1rem;">くじを引く</button> <!-- くじ引きボタン -->

    <div class="controls">
      <button class="sub-btn" onclick="toggleAll(true)">全選択</button> <!-- 全選択ボタン -->
      <button class="sub-btn" onclick="toggleAll(false)">全解除</button> <!-- 全解除ボタン -->
    </div>

    <div class="weapon-container" id="weaponContainer"></div> <!-- JavaScriptで武器要素が入る枠 -->
  </div>

  <!-- 外部JavaScriptファイルの読み込み -->
  <script src="script.js"></script>

</body>
</html>

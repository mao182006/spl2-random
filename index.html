<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スプラ2 武器くじ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 右上のデータセットボタン -->
  <button class="menu-toggle-btn" id="openMenuBtn">📁 データセット</button>

  <div class="container">
    <h1>スプラ2 ナワバリ武器くじ</h1>
    <div class="result-box" id="result">???</div>
    
    <div class="total-count" id="totalCount">選択中: 0 / 0</div>

    <button class="draw-btn" onclick="drawWeapon()">くじを引く</button>

    <div class="controls">
      <button class="sub-btn" onclick="toggleAll(true)">全選択</button>
      <button class="sub-btn" onclick="toggleAll(false)">全解除</button>
    </div>

    <!-- 武器リスト表示領域 -->
    <div class="weapon-container" id="weaponContainer"></div>
  </div>

  <!-- 右からスライドするデータセットパネル -->
  <div class="dataset-panel" id="datasetPanel">
    <div class="panel-header">
      <h2>データセット一覧</h2>
      <button class="close-btn" id="closeMenuBtn">×</button>
    </div>
    <div class="panel-body" id="datasetContainer"></div>
  </div>

  <!-- パネル背景のオーバーレイ -->
  <div class="overlay" id="overlay"></div>

  <!-- ポップアップ通知 -->
  <div id="toast" class="toast">メッセージ</div>

  <script src="script.js"></script>
</body>
</html>

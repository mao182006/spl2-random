<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スプラ2 武器くじ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>スプラ2 ナワバリ武器くじ</h1>
    <div class="result-box" id="result">???</div>
    
    <div class="total-count" id="totalCount">選択中: 0 / 0</div>

    <button onclick="drawWeapon()" style="margin-bottom: 1rem;">くじを引く</button>

    <!-- ボタンエリアに「保存」ボタンを追加 -->
    <div class="controls">
      <button class="sub-btn" onclick="saveStateManually()" style="background-color: #00bcd4; color: #000;">保存</button>
      <button class="sub-btn" onclick="toggleAll(true)">全選択</button>
      <button class="sub-btn" onclick="toggleAll(false)">全解除</button>
      <button class="sub-btn" onclick="resetSavedState()" style="background-color: #552222;">リセット</button>
    </div>

    <!-- 保存完了メッセージ表示エリア -->
    <div id="toast" class="toast">状態を保存しました！</div>

    <div class="weapon-container" id="weaponContainer"></div>
  </div>

  <script src="script.js"></script>

</body>
</html>

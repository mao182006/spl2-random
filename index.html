<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スプラ2 ナワバリ武器くじ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>スプラ2 ナワバリ武器くじ</h1>
    <div class="result-box" id="result">???</div>
    <div class="total-count" id="totalCount">選択中: 0 / 0</div>

    <button class="draw-btn" onclick="drawWeapon()">くじを引く</button>

    <!-- ボタンの並び順: [全選択] [保存] [全解除] [リセット] -->
    <div class="controls">
      <button class="sub-btn" onclick="toggleAll(true)">全選択</button>
      <button class="sub-btn save-quick-btn" onclick="saveCurrentState()">保存</button>
      <button class="sub-btn" onclick="toggleAll(false)">全解除</button>
      <button class="sub-btn reset-btn" onclick="resetToDefault()">リセット</button>
    </div>

    <!-- データセットアコーディオン -->
    <details class="dataset-accordion">
      <summary>📁 データセット一覧</summary>
      <div class="dataset-body" id="datasetContainer"></div>
    </details>

    <!-- 武器リスト表示領域 -->
    <div class="weapon-container" id="weaponContainer"></div>
  </div>

  <!-- 通知トースト -->
  <div id="toast" class="toast">メッセージ</div>

  <script src="script.js"></script>
</body>
</html>
